name: Deploy to Karzintell Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-karzintell
  cancel-in-progress: false

jobs:
  deploy:
    # استفاده از self-hosted runner (روی ویندوز شما) به‌دلیل بلاک شدن IP های GitHub Actions توسط هاست ایران
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Check Node.js
        run: |
          echo "Node version: $(node -v 2>&1 || echo 'NOT FOUND')"
          echo "npm version: $(npm -v 2>&1 || echo 'NOT FOUND')"

          if ! command -v node &> /dev/null; then
            echo "❌ Node.js not found in PATH"
            echo "PATH: $PATH"
            echo ""
            echo "Trying common locations..."

            for path in "/c/Program Files/nodejs" "/c/Program Files (x86)/nodejs" "/c/Users/$USER/AppData/Roaming/npm"; do
              if [ -f "$path/node.exe" ]; then
                echo "Found node at: $path"
                echo "$path" >> $GITHUB_PATH
                export PATH="$path:$PATH"
                break
              fi
            done
          fi

          # Check again
          if ! command -v node &> /dev/null; then
            echo "❌ Node.js still not found. Please install Node.js 20+ from https://nodejs.org/"
            exit 1
          fi

          NODE_VERSION=$(node -v)
          NODE_MAJOR=$(echo "$NODE_VERSION" | sed 's/v\([0-9]*\).*/\1/')

          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "❌ Node.js version $NODE_VERSION is too old. Need 20+."
            exit 1
          fi

          echo "✅ Node.js $NODE_VERSION is ready"

      # ──────────────────────────────────────────────
      # ۱) Build API (NestJS → dist/)
      # ──────────────────────────────────────────────
      - name: 🔨 Build API
        working-directory: apps/api
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ──────────────────────────────────────────────
      # ۲) Build Web (Next.js → .next/)
      # ──────────────────────────────────────────────
      - name: 🔨 Build Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SITE_URL: https://karzintell.com
          NEXT_PUBLIC_APP_URL: https://karzintell.com
          BACKEND_URL: https://api.karzintell.com
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ──────────────────────────────────────────────
      # ۳) Package deployment tarballs
      # ──────────────────────────────────────────────
      - name: 📦 Package API
        run: |
          tar -czf api-deploy.tar.gz \
            -C apps/api \
            dist \
            package.json \
            package-lock.json \
            .npmrc

      - name: 📦 Package Web
        run: |
          tar -czf web-deploy.tar.gz \
            -C apps/web \
            .next \
            public \
            server.js \
            package.json \
            package-lock.json \
            next.config.ts \
            postcss.config.mjs \
            .npmrc

      # ──────────────────────────────────────────────
      # ۴) Setup SSH connection
      # ──────────────────────────────────────────────
      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set +e
          set -x

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key, normalize line endings, and trim trailing empty lines
          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | sed 's/\r$//' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "=== Key info ==="
          wc -c ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | cut -c1-25
          tail -1 ~/.ssh/deploy_key | cut -c1-25

          echo "=== Validate key format ==="
          grep -c "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key
          grep -c "END OPENSSH PRIVATE KEY" ~/.ssh/deploy_key

          echo "=== Validate key parseable ==="
          ssh-keygen -y -f ~/.ssh/deploy_key
          echo "ssh-keygen exit: $?"

          echo "=== Add server to known_hosts ==="
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1
          echo "ssh-keyscan exit: $?"

          echo "=== Test SSH connection ==="
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o PreferredAuthentications=publickey \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH_CONNECTION_OK"' 2>&1
          SSH_EXIT=$?
          echo "=== SSH exit code: $SSH_EXIT ==="

          if [ "$SSH_EXIT" -ne 0 ]; then
            echo "❌ SSH failed with code $SSH_EXIT"
            exit 1
          fi
          echo "✅ SSH OK"

      # ──────────────────────────────────────────────
      # ۵) Upload packages to server
      # ──────────────────────────────────────────────
      - name: 📤 Upload packages
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Create staging directory on server
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/karzinte/deploy-staging'

          # Upload tarballs and deploy script
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            api-deploy.tar.gz \
            web-deploy.tar.gz \
            scripts/deploy-on-server.sh \
            "$SSH_USER@$SSH_HOST:/home/karzinte/deploy-staging/"

      # ──────────────────────────────────────────────
      # ۶) Deploy on server
      # ──────────────────────────────────────────────
      - name: 🚀 Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'bash /home/karzinte/deploy-staging/deploy-on-server.sh 2>&1'

      # ──────────────────────────────────────────────
      # ۷) Verify deployment
      # ──────────────────────────────────────────────
      - name: ✅ Verify deployment
        run: |
          echo "Waiting for apps to restart..."
          sleep 10
          echo "Testing API health..."
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.karzintell.com/api/v1/health || echo "000")
          echo "  API: HTTP $API_STATUS"
          echo "Testing Web..."
          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://karzintell.com || echo "000")
          echo "  Web: HTTP $WEB_STATUS"

      - name: 📊 Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** self-hosted Windows" >> $GITHUB_STEP_SUMMARY
