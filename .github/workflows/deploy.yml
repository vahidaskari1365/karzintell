name: Deploy to Karzintell Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-karzintell
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      # ──────────────────────────────────────────────
      # ۱) Build API (NestJS → dist/)
      # ──────────────────────────────────────────────
      - name: 🔨 Build API
        working-directory: apps/api
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ──────────────────────────────────────────────
      # ۲) Build Web (Next.js → .next/)
      # ──────────────────────────────────────────────
      - name: 🔨 Build Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SITE_URL: https://karzintell.com
          NEXT_PUBLIC_APP_URL: https://karzintell.com
          BACKEND_URL: https://api.karzintell.com
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ──────────────────────────────────────────────
      # ۳) Package deployment tarballs
      # ──────────────────────────────────────────────
      - name: 📦 Package API
        run: |
          tar -czf api-deploy.tar.gz \
            -C apps/api \
            dist \
            package.json \
            package-lock.json \
            .npmrc

      - name: 📦 Package Web
        run: |
          tar -czf web-deploy.tar.gz \
            -C apps/web \
            .next \
            public \
            server.js \
            package.json \
            package-lock.json \
            next.config.ts \
            postcss.config.mjs \
            .npmrc

      # ──────────────────────────────────────────────
      # ۴) Setup SSH connection
      # ──────────────────────────────────────────────
      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key, normalize line endings, and trim trailing empty lines
          # (Handles CRLF from Windows clipboard, extra trailing newlines, etc.)
          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | sed 's/\r$//' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Debug: show key info (without revealing content)
          echo "Key file size: $(wc -c < ~/.ssh/deploy_key) bytes"
          echo "Key file lines: $(wc -l < ~/.ssh/deploy_key) lines"
          FIRST_LINE=$(head -1 ~/.ssh/deploy_key)
          LAST_LINE=$(tail -1 ~/.ssh/deploy_key)
          echo "Key first line starts with: ${FIRST_LINE:0:25}..."
          echo "Key last line starts with: ${LAST_LINE:0:25}..."

          # Validate key format (BEGIN and END markers, on any line)
          if ! grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "❌ ERROR: Key does not contain 'BEGIN OPENSSH PRIVATE KEY' marker"
            echo "First 30 chars of file: $(head -c 30 ~/.ssh/deploy_key)"
            exit 1
          fi
          if ! grep -q "END OPENSSH PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "❌ ERROR: Key does not contain 'END OPENSSH PRIVATE KEY' marker"
            echo "Last 30 chars of file: $(tail -c 30 ~/.ssh/deploy_key)"
            exit 1
          fi
          echo "✅ Key format looks valid (BEGIN + END markers present)"

          # Verify key is parseable by ssh-keygen
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "❌ ERROR: ssh-keygen cannot parse the private key"
            echo "This usually means the key was pasted incorrectly (extra/missing characters)"
            exit 1
          fi
          echo "✅ Private key is valid and parseable"

          # Add server to known_hosts (prevent host key verification prompt)
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ Host key added to known_hosts"

          # Test connection (write output to file to avoid masking issues)
          echo "Testing SSH connection..."
          SSH_OUTPUT=/tmp/ssh_test.log
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o PreferredAuthentications=publickey \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH_CONNECTION_OK"' > "$SSH_OUTPUT" 2>&1
          SSH_EXIT=$?
          echo "SSH exit code: $SSH_EXIT"
          echo "=== SSH output (sanitized - masking potential secrets) ==="
          # Replace any occurrence of host/user/port with placeholder
          sed -e "s/$SSH_HOST/SSH_HOST/g" \
              -e "s/$SSH_USER/SSH_USER/g" \
              -e "s/$SSH_PORT/SSH_PORT/g" \
              "$SSH_OUTPUT" || true
          echo "=== End of SSH output ==="

          if [ "$SSH_EXIT" -ne 0 ]; then
            echo "❌ SSH connection failed with exit code $SSH_EXIT"
            echo "Common causes:"
            echo "  - 255: Permission denied (publickey) — public key not in authorized_keys"
            echo "  - 1:   Connection refused / network issue"
            exit 1
          fi

          if grep -q "SSH_CONNECTION_OK" "$SSH_OUTPUT"; then
            echo "✅ SSH connection successful!"
          else
            echo "❌ SSH connected but expected response not received"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # ۵) Upload packages to server
      # ──────────────────────────────────────────────
      - name: 📤 Upload packages
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Create staging directory on server
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/karzinte/deploy-staging'

          # Upload tarballs and deploy script
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            api-deploy.tar.gz \
            web-deploy.tar.gz \
            scripts/deploy-on-server.sh \
            "$SSH_USER@$SSH_HOST:/home/karzinte/deploy-staging/"

      # ──────────────────────────────────────────────
      # ۶) Deploy on server
      # ──────────────────────────────────────────────
      - name: 🚀 Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'bash /home/karzinte/deploy-staging/deploy-on-server.sh 2>&1'

      # ──────────────────────────────────────────────
      # ۷) Verify deployment
      # ──────────────────────────────────────────────
      - name: ✅ Verify deployment
        run: |
          echo "Waiting for apps to restart..."
          sleep 10

          echo "Testing API health..."
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.karzintell.com/api/v1/health || echo "000")
          echo "  API: HTTP $API_STATUS"

          echo "Testing Web..."
          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://karzintell.com || echo "000")
          echo "  Web: HTTP $WEB_STATUS"

          if [ "$API_STATUS" = "200" ] || [ "$API_STATUS" = "404" ]; then
            echo "✅ API is responding"
          else
            echo "⚠️  API might have issues (HTTP $API_STATUS)"
          fi

          if [ "$WEB_STATUS" = "200" ]; then
            echo "✅ Web is responding"
          else
            echo "⚠️  Web might have issues (HTTP $WEB_STATUS)"
          fi

      - name: 📊 Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** ${{ secrets.SSH_HOST }}" >> $GITHUB_STEP_SUMMARY
