name: Deploy to Karzintell Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-karzintell
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      # ──────────────────────────────────────────────
      # ۱) Build API (NestJS → dist/)
      # ──────────────────────────────────────────────
      - name: 🔨 Build API
        working-directory: apps/api
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ──────────────────────────────────────────────
      # ۲) Build Web (Next.js → .next/)
      # ──────────────────────────────────────────────
      - name: 🔨 Build Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SITE_URL: https://karzintell.com
          NEXT_PUBLIC_APP_URL: https://karzintell.com
          BACKEND_URL: https://api.karzintell.com
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ──────────────────────────────────────────────
      # ۳) Package deployment tarballs
      # ──────────────────────────────────────────────
      - name: 📦 Package API
        run: |
          tar -czf api-deploy.tar.gz \
            -C apps/api \
            dist \
            package.json \
            package-lock.json \
            .npmrc

      - name: 📦 Package Web
        run: |
          tar -czf web-deploy.tar.gz \
            -C apps/web \
            .next \
            public \
            server.js \
            package.json \
            package-lock.json \
            next.config.ts \
            postcss.config.mjs \
            .npmrc

      # ──────────────────────────────────────────────
      # ۴) Setup SSH connection
      # ──────────────────────────────────────────────
      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set +e  # Don't exit on error - we want to see all output
          set -x  # Trace every command

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key, normalize line endings, and trim trailing empty lines
          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | sed 's/\r$//' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "=== Key info ==="
          wc -c ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | cut -c1-25
          tail -1 ~/.ssh/deploy_key | cut -c1-25

          echo "=== Validate key format ==="
          grep -c "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key
          grep -c "END OPENSSH PRIVATE KEY" ~/.ssh/deploy_key

          echo "=== Validate key parseable ==="
          ssh-keygen -y -f ~/.ssh/deploy_key
          echo "ssh-keygen exit: $?"

          echo "=== Add server to known_hosts ==="
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1
          echo "ssh-keyscan exit: $?"

          echo "=== Test SSH connection ==="
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o PreferredAuthentications=publickey \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH_CONNECTION_OK"' 2>&1
          SSH_EXIT=$?
          echo "=== SSH exit code: $SSH_EXIT ==="

          if [ "$SSH_EXIT" -ne 0 ]; then
            echo "❌ SSH failed with code $SSH_EXIT"
            exit 1
          fi
          echo "✅ SSH OK"

      # ──────────────────────────────────────────────
      # ۵) Upload packages to server
      # ──────────────────────────────────────────────
      - name: 📤 Upload packages
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Create staging directory on server
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/karzinte/deploy-staging'

          # Upload tarballs and deploy script
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            api-deploy.tar.gz \
            web-deploy.tar.gz \
            scripts/deploy-on-server.sh \
            "$SSH_USER@$SSH_HOST:/home/karzinte/deploy-staging/"

      # ──────────────────────────────────────────────
      # ۶) Deploy on server
      # ──────────────────────────────────────────────
      - name: 🚀 Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'bash /home/karzinte/deploy-staging/deploy-on-server.sh 2>&1'

      # ──────────────────────────────────────────────
      # ۷) Verify deployment
      # ──────────────────────────────────────────────
      - name: ✅ Verify deployment
        run: |
          echo "Waiting for apps to restart..."
          sleep 10

          echo "Testing API health..."
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.karzintell.com/api/v1/health || echo "000")
          echo "  API: HTTP $API_STATUS"

          echo "Testing Web..."
          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://karzintell.com || echo "000")
          echo "  Web: HTTP $WEB_STATUS"

          if [ "$API_STATUS" = "200" ] || [ "$API_STATUS" = "404" ]; then
            echo "✅ API is responding"
          else
            echo "⚠️  API might have issues (HTTP $API_STATUS)"
          fi

          if [ "$WEB_STATUS" = "200" ]; then
            echo "✅ Web is responding"
          else
            echo "⚠️  Web might have issues (HTTP $WEB_STATUS)"
          fi

      - name: 📊 Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** ${{ secrets.SSH_HOST }}" >> $GITHUB_STEP_SUMMARY
