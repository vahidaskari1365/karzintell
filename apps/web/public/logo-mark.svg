<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="kz-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="kz-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="kz-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="kz-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- مربع سبز K با برش شورون -->
  <path d="M40 20 h62 q20 0 20 20 l-27 67 l27 73 q0 20 -20 20 h-62 q-20 0 -20 -20 v-130 q0 -20 20 -20 z"
        fill="url(#kz-green)" filter="url(#kz-shadow)"/>

  <!-- شورون نقره‌ای -->
  <path d="M132 56 L82 110 L132 164" fill="none" stroke="url(#kz-silver)"
        stroke-width="27" stroke-linecap="round" stroke-linejoin="round" filter="url(#kz-shadow)"/>

  <!-- نقطه سبز -->
  <circle cx="186" cy="90" r="15" fill="url(#kz-green)" filter="url(#kz-glow)"/>
  <circle cx="181" cy="84" r="4" fill="#d1fae5" opacity="0.85"/>
</svg>
