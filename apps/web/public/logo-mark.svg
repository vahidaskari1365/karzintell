<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <defs>
    <linearGradient id="kz-green" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.45" stop-color="#16c172"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="kz-silver" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e5e9ef"/>
      <stop offset="1" stop-color="#9aa5b5"/>
    </linearGradient>
    <radialGradient id="kz-dot" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.55" stop-color="#16c172"/>
      <stop offset="1" stop-color="#047857"/>
    </radialGradient>
    <filter id="kz-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#010409" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- مکعب K سبز با برش شورونی لبه راست -->
  <path transform="translate(6,0)" d="M44 20 h56 q20 0 20 20 l-26 66 l26 74 q0 20 -20 20 h-56 q-20 0 -20 -20 v-140 q0 -20 20 -20 z"
        fill="url(#kz-green)" filter="url(#kz-soft)"/>

  <!-- شورون نقره‌ای با کمی چرخش (مثل تصویر) -->
  <path d="M138 52 L84 108 L138 164" fill="none" stroke="url(#kz-silver)"
        stroke-width="29" stroke-linecap="square" stroke-linejoin="round"
        transform="rotate(-7 111 108)" filter="url(#kz-soft)"/>

  <!-- نقطه سبز براق -->
  <circle cx="192" cy="92" r="15" fill="url(#kz-dot)" filter="url(#kz-soft)"/>
  <circle cx="186" cy="85" r="4.5" fill="#d9fbe9" opacity="0.9"/>
</svg>
