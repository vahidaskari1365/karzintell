# ============================================================================
# کارزینتل — سرویس‌های کمکی توسعه
# دیتابیس پروژه MySQL/MariaDB است (روی cPanel یا سرور MySQL مدیریت‌شده).
# schema را با `npm run db:migrate` ایجاد/به‌روزرسانی کنید.
# این compose فقط Redis، جستجو، فایل و ایمیل را می‌آورد.
# ============================================================================
name: karzintell

services:
  # ------------------------------------------------------------------ کش/صف
  redis:
    image: redis:7-alpine
    container_name: karzintell-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ جستجو
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: karzintell-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meilisearch-key-change-me}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  # ---------------------------------------------------- ذخیره‌سازی فایل محلی
  # در production از S3 سازگار یا فضای ذخیره‌سازی هاست استفاده کنید.
  minio:
    image: minio/minio:latest
    container_name: karzintell-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-karzintell}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dev-minio-password-change-me}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # کنسول مدیریت
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: karzintell-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-karzintell} ${S3_SECRET_KEY:-dev-minio-password-change-me};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-product-media};
      /usr/bin/mc anonymous set download local/${S3_BUCKET:-product-media};
      exit 0;
      "

  # --------------------------------------------------------- ایمیل (توسعه)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: karzintell-mailhog
    ports:
      - "8025:8025"   # صندوق ورودی
      - "1025:1025"   # SMTP
    restart: unless-stopped

volumes:
  redis_data:
  meili_data:
  minio_data:
